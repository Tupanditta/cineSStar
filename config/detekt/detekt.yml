# Sobre la configuración por defecto de detekt (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    excludes: ['**/test/**']
    # Los DAO de Room agrupan todas las consultas de una tabla.
    allowedFunctionsPerInterface: 20
style:
  MagicNumber:
    excludes: ['**/ui/theme/**', '**/test/**']
    ignoreEnums: true
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    excludeGuardClauses: true
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
